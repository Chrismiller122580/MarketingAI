  <text x="256" y="320" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="280" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">C</text>
